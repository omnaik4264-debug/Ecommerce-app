<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Web Application</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; padding: 20px; background-color: #eef2f5; }
    
    .nav {
      background: #007bff;
      color: white;
      padding: 15px 20px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .nav h1 { margin: 0; font-size: 22px; }
    .role-container { display: flex; align-items: center; gap: 8px; }
    .role-container select { padding: 6px 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }

    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      flex: 1;
      min-width: 280px;
    }

    .card h2 { margin-top: 0; color: #333; font-size: 18px; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .card h3 { color: #555; font-size: 15px; margin-top: 15px; }

    .product-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { opacity: 0.9; }
    button.admin-btn { background: #dc3545; width: 100%; margin-top: 10px; }

    input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .cart-item, .order-item {
      padding: 6px 0;
      font-size: 14px;
      color: #444;
    }
    hr { margin: 15px 0; border: 0; border-top: 1px solid #eee; }
  </style>
</head>
<body>

  <div class="nav">
    <h1>E-Commerce Dashboard</h1>
    <div class="role-container">
      <label>Role:</label>
      <select id="roleSelect" onchange="switchRole()">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
  </div>

  <div class="container">
    <!-- Product Catalog -->
    <div class="card">
      <h2>Product Catalog</h2>
      <div id="productList"></div>
    </div>

    <!-- Shopping Cart & Order Tracking -->
    <div class="card">
      <h2>Shopping Cart</h2>
      <div id="cartList">Cart is empty</div>
      <p><strong>Total: $<span id="cartTotal">0</span></strong></p>
      <button onclick="checkout()">Checkout</button>

      <hr>

      <h2>Order Tracking</h2>
      <div id="orderList">No orders placed.</div>
    </div>

    <!-- Admin Controls -->
    <div class="card" id="adminPanel" style="display: none;">
      <h2>Admin Controls</h2>
      <h3>Add Product</h3>
      <input type="text" id="pName" placeholder="Product Name">
      <input type="number" id="pPrice" placeholder="Price">
      <input type="text" id="pCat" placeholder="Category">
      <button class="admin-btn" onclick="addProduct()">Add Product</button>
    </div>
  </div>

  <script>
    let defaultProducts = [
      { id: 1, name: "Laptop", price: 999, category: "Electronics" },
      { id: 2, name: "Headphones", price: 199, category: "Electronics" },
      { id: 3, name: "Sneakers", price: 85, category: "Footwear" }
    ];

    let products = JSON.parse(localStorage.getItem('products')) || defaultProducts;
    let orders = JSON.parse(localStorage.getItem('orders')) || [];
    let cart = [];
    let currentRole = 'user';

    function switchRole() {
      currentRole = document.getElementById('roleSelect').value;
      document.getElementById('adminPanel').style.display = (currentRole === 'admin') ? 'block' : 'none';
    }

    function renderProducts() {
      const list = document.getElementById('productList');
      list.innerHTML = '';
      products.forEach(p => {
        list.innerHTML += `
          <div class="product-item">
            <div>
              <strong>${p.name}</strong> - $${p.price} 
              <br><small style="color:#777;">${p.category}</small>
            </div>
            <button onclick="addToCart('${p.name}', ${p.price})">Add to Cart</button>
          </div>
        `;
      });
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      renderCart();
    }

    function renderCart() {
      const cartList = document.getElementById('cartList');
      if (cart.length === 0) {
        cartList.innerHTML = 'Cart is empty';
        document.getElementById('cartTotal').innerText = '0';
        return;
      }
      let total = 0;
      cartList.innerHTML = '';
      cart.forEach((item) => {
        total += item.price;
        cartList.innerHTML += `<div class="cart-item">• ${item.name} - $${item.price}</div>`;
      });
      document.getElementById('cartTotal').innerText = total;
    }

    function checkout() {
      if (cart.length === 0) return alert("Cart is empty!");
      const total = cart.reduce((sum, item) => sum + item.price, 0);

      const newOrder = { id: orders.length + 1, total, count: cart.length };
      orders.push(newOrder);
      localStorage.setItem('orders', JSON.stringify(orders));

      alert("Order placed successfully!");
      cart = [];
      renderCart();
      renderOrders();
    }

    function renderOrders() {
      const orderList = document.getElementById('orderList');
      if (orders.length === 0) {
        orderList.innerHTML = 'No orders placed.';
        return;
      }
      orderList.innerHTML = '';
      orders.forEach(o => {
        orderList.innerHTML += `<div class="order-item"><strong>Order #${o.id}</strong> - Status: Placed ($${o.total})</div>`;
      });
    }

    function addProduct() {
      const name = document.getElementById('pName').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const category = document.getElementById('pCat').value.trim();

      if (!name || !price || !category) {
        alert("Please fill in all fields (Name, Price, Category)!");
        return;
      }

      // Add to array
      const newProduct = {
        id: products.length + 1,
        name: name,
        price: Number(price),
        category: category
      };

      products.push(newProduct);
      
      // Save locally
      localStorage.setItem('products', JSON.stringify(products));

      // Clear input fields
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pCat').value = '';

      // Refresh catalog list display
      renderProducts();
      alert("Product added successfully!");
    }

    // Initial render
    renderProducts();
    renderOrders();
  </script>
</body>
</html>
